name: Secure CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit:prod
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm web:lint
      - run: pnpm test
      - run: pnpm test:cov
      - run: pnpm web:test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm openapi:export
      - run: git diff --exit-code -- docs/openapi.json
      - run: pnpm web:build

  integration:
    name: Real infrastructure integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:integration

  dast:
    name: DAST with OWASP ZAP
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: secure-service-desk-dast
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create ephemeral CI environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          private_key="$(openssl genrsa 2048 2>/dev/null)"
          private_key_b64="$(printf '%s' "$private_key" | base64 -w0)"
          public_key_b64="$(printf '%s' "$private_key" | openssl rsa -pubout 2>/dev/null | base64 -w0)"
          mfa_key_b64="$(openssl rand -base64 32 | tr -d '\n')"
          sed -i \
            -e "s|^JWT_KEY_ID=.*|JWT_KEY_ID=ci-dast-key|" \
            -e "s|^JWT_PRIVATE_KEY_BASE64=.*|JWT_PRIVATE_KEY_BASE64=$private_key_b64|" \
            -e "s|^JWT_PUBLIC_KEY_BASE64=.*|JWT_PUBLIC_KEY_BASE64=$public_key_b64|" \
            -e "s|^MFA_ENCRYPTION_KEY_BASE64=.*|MFA_ENCRYPTION_KEY_BASE64=$mfa_key_b64|" \
            -e 's|^MONGODB_URI=.*|MONGODB_URI=mongodb://mongodb:27017/secure_service_desk|' \
            -e 's|^REDIS_URL=.*|REDIS_URL=redis://redis:6379|' \
            -e 's|^CORS_ORIGINS=.*|CORS_ORIGINS=http://localhost:3001|' \
            .env
          mkdir -p artifacts/zap
      - name: Build and start disposable stack
        run: docker compose -f compose.yml up --build --detach --wait --wait-timeout 180
      - name: Smoke check disposable stack
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3001/
          docker compose -f compose.yml exec -T api node -e "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1))"
      - name: Run ZAP baseline against frontend proxy
        continue-on-error: true
        run: |
          docker run --rm --network secure-service-desk-dast_default \
            -v "$PWD/artifacts/zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://web:3001 -m 2 -I \
            -r frontend-baseline.html -J frontend-baseline.json
      - name: Run ZAP API scan against OpenAPI
        continue-on-error: true
        run: |
          docker run --rm --network secure-service-desk-dast_default \
            -v "$PWD/artifacts/zap:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://api:3000/api/docs-json -f openapi -I \
            -r api-scan.html -J api-scan.json
      - name: Upload ZAP reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-reports
          path: artifacts/zap/
          if-no-files-found: warn
      - name: Stop disposable stack
        if: ${{ always() }}
        run: docker compose -f compose.yml down --volumes --remove-orphans

  sonar:
    name: SonarCloud analysis
    needs: quality
    if: ${{ vars.SONAR_ENABLED == 'true' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify Sonar credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is required when SONAR_ENABLED=true"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:cov
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  dependency-scan:
    name: Trivy workspace scan
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-workspace-results.sarif
          limit-severities-for-sarif: true
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: ${{ always() && hashFiles('trivy-workspace-results.sarif') != '' }}
        with:
          sarif_file: trivy-workspace-results.sarif

  trivy:
    name: Trivy image scan
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            image: secure-service-desk-api:ci
          - name: web
            dockerfile: apps/web/Dockerfile
            image: secure-service-desk-web:ci
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: build_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ always() && steps.build_image.outcome == 'success' }}
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.name }}-results.sarif
          limit-severities-for-sarif: true
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: ${{ always() && hashFiles(format('trivy-{0}-results.sarif', matrix.name)) != '' }}
        with:
          sarif_file: trivy-${{ matrix.name }}-results.sarif
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ always() && steps.build_image.outcome == 'success' }}
        with:
          image-ref: ${{ matrix.image }}
          scanners: secret
          format: table
          exit-code: 1
